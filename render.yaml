# Déploiement complet sur Render : BACKEND (Docker) + FRONTEND (site statique).
# 1) Pousse le repo sur GitHub.
# 2) Render → New + → Blueprint → sélectionne ce repo (il lit ce fichier).
# 3) Renseigne les variables marquées "sync: false" (clés Paystack, Groq, URLs).
services:
  # ---------- FRONTEND (React/Vite) : site statique ----------
  - type: web
    name: cvbuilder-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false          # ex: https://cvbuilder-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------- BACKEND (Django) : conteneur Docker ----------
  - type: web
    name: cvbuilder-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter           # WeasyPrint/LibreOffice nécessitent + de RAM que le plan free
    healthCheckPath: /api/templates/
    disk:
      name: media
      mountPath: /app/media   # photos & PDF générés (persistants)
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false          # ex: cvbuilder-api.onrender.com
      - key: DJANGO_CORS_ORIGINS
        sync: false          # ex: https://cvbuilder-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false          # ex: https://cvbuilder-web.onrender.com
      - key: DJANGO_MEDIA_ROOT
        value: /app/media
      - key: PAYMENTS_ENFORCED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cvbuilder-db
          property: connectionString
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: XOF
      - key: PAYSTACK_CALLBACK_URL
        sync: false          # ex: https://cvbuilder-web.onrender.com/dashboard

databases:
  - name: cvbuilder-db
    plan: basic-256mb
